remap = ['^(file:.*/[^/.]+)$ $1.md'] # resolve extensionless internal links (any slug, incl. 4-char "blue") to their .md source
require_https = true

# Hosts that block automated checkers — a bot gets 401/403 even though the page
# is live in a browser (storefronts, contest pages, AI image generators).
exclude = ['^https?://.*(openart.ai|midjourney.com|openai.com|distrokid.com|99designs.com)/']

# A 429 means the host rate-limited the checker, not that the link is broken;
# tolerate it (e.g. upload.wikimedia.org). Lower concurrency to provoke it less.
accept = ["200..=299", "429"]
max_concurrency = 4
